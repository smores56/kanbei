[package]
name = "kanbei-session"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
kanbei-capabilities.workspace = true
kanbei-context.workspace = true
kanbei-core.workspace = true
kanbei-gc.workspace = true
kanbei-log.workspace = true
kanbei-memory.workspace = true
kanbei-modules.workspace = true
kanbei-objects.workspace = true
kanbei-policy.workspace = true
kanbei-provider.workspace = true
kanbei-retrieval.workspace = true
kanbei-scheduler.workspace = true
kanbei-scopes.workspace = true
kanbei-services.workspace = true
kanbei-snapshot.workspace = true
kanbei-telemetry = { workspace = true, optional = true }
kanbei-tools.workspace = true
kanbei-ui.workspace = true
kanbei-vm.workspace = true
kanbei-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# M8 wave 1: optional OpenTelemetry-compatible telemetry (correlation
# spans + storage gauges). Off by default — the default build carries no
# telemetry fields or dependencies.
otel = ["dep:kanbei-telemetry"]

[dev-dependencies]
serde_json.workspace = true
kanbei-capabilities.workspace = true
kanbei-core.workspace = true
kanbei-log.workspace = true
kanbei-modules.workspace = true
kanbei-policy.workspace = true
kanbei-scopes.workspace = true
kanbei-services.workspace = true
kanbei-snapshot.workspace = true
kanbei-vm.workspace = true

[[bin]]
name = "workbench"
path = "src/bin/workbench.rs"
