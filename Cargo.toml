[workspace]
resolver = "2"
members = [
    "crates/kanbei-core",
    "crates/kanbei-log",
    "crates/kanbei-objects",
    "crates/kanbei-session",
    "crates/kanbei-snapshot",
    "crates/kanbei-projection",
    "crates/kanbei-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
kanbei-core = { path = "crates/kanbei-core" }
kanbei-log = { path = "crates/kanbei-log" }
kanbei-objects = { path = "crates/kanbei-objects" }
kanbei-session = { path = "crates/kanbei-session" }
kanbei-snapshot = { path = "crates/kanbei-snapshot" }
kanbei-projection = { path = "crates/kanbei-projection" }

blake3 = "1"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
zstd = "0.13"
crossbeam-channel = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
