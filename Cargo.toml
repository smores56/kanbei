[workspace]
resolver = "2"
members = [
    "crates/kanbei-core",
    "crates/kanbei-log",
    "crates/kanbei-memory",
    "crates/kanbei-objects",
    "crates/kanbei-session",
    "crates/kanbei-snapshot",
    "crates/kanbei-projection",
    "crates/kanbei-testkit",
    "crates/kanbei-guest",
    "crates/kanbei-vm",
    "crates/kanbei-capabilities",
    "crates/kanbei-context",
    "crates/kanbei-policy",
    "crates/kanbei-retrieval",
    "crates/kanbei-services",
    "crates/kanbei-modules",
    "crates/kanbei-scopes",
    "crates/kanbei-provider",
    "crates/kanbei-scheduler",
    "crates/kanbei-tools",
    "crates/kanbei-ui",
]
# kanbei-guest builds only for wasm32-wasip1 with special link args; exclude it
# from implicit `--workspace` selection (build explicitly with
# `cargo build -p kanbei-guest --target wasm32-wasip1 --release`).
default-members = [
    "crates/kanbei-core",
    "crates/kanbei-log",
    "crates/kanbei-memory",
    "crates/kanbei-objects",
    "crates/kanbei-session",
    "crates/kanbei-snapshot",
    "crates/kanbei-projection",
    "crates/kanbei-testkit",
    "crates/kanbei-vm",
    "crates/kanbei-capabilities",
    "crates/kanbei-context",
    "crates/kanbei-policy",
    "crates/kanbei-retrieval",
    "crates/kanbei-services",
    "crates/kanbei-modules",
    "crates/kanbei-scopes",
    "crates/kanbei-provider",
    "crates/kanbei-scheduler",
    "crates/kanbei-tools",
    "crates/kanbei-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
kanbei-core = { path = "crates/kanbei-core" }
kanbei-log = { path = "crates/kanbei-log" }
kanbei-memory = { path = "crates/kanbei-memory" }
kanbei-objects = { path = "crates/kanbei-objects" }
kanbei-session = { path = "crates/kanbei-session" }
kanbei-snapshot = { path = "crates/kanbei-snapshot" }
kanbei-projection = { path = "crates/kanbei-projection" }
kanbei-vm = { path = "crates/kanbei-vm" }
kanbei-capabilities = { path = "crates/kanbei-capabilities" }
kanbei-context = { path = "crates/kanbei-context" }
kanbei-policy = { path = "crates/kanbei-policy" }
kanbei-retrieval = { path = "crates/kanbei-retrieval" }
kanbei-services = { path = "crates/kanbei-services" }
kanbei-modules = { path = "crates/kanbei-modules" }
kanbei-scopes = { path = "crates/kanbei-scopes" }
kanbei-provider = { path = "crates/kanbei-provider" }
kanbei-scheduler = { path = "crates/kanbei-scheduler" }
kanbei-tools = { path = "crates/kanbei-tools" }
kanbei-ui = { path = "crates/kanbei-ui" }

blake3 = "1"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
zstd = "0.13"
crossbeam-channel = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1.1", features = ["termios", "pty", "pipe", "std"] }
